name: Trip2Go CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Kodun İndirilmesi (Checkout)
      uses: actions/checkout@v3

    - name: 🟩 Node.js Kurulumu
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: ⚙️ Backend Paketlerinin Yüklenmesi
      working-directory: ./backend
      run: npm install

    - name: ⚙️ Frontend Paketlerinin Yüklenmesi
      working-directory: ./frontend
      run: npm install

    - name: 🏗️ Frontend Derleme Testi (Build Check)
      working-directory: ./frontend
      run: npm run build
      
    - name: 🐳 Docker Compose Imajlarının Test Edilmesi
      run: docker-compose build
