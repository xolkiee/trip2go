version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trip2go-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
    restart: unless-stopped
    depends_on:
      - redis
      - rabbitmq
    networks:
      - trip2go-network

  redis:
    image: redis:alpine
    container_name: trip2go-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - trip2go-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: trip2go-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    networks:
      - trip2go-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trip2go-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - trip2go-network

networks:
  trip2go-network:
    driver: bridge